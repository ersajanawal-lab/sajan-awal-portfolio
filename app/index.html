 showKey('');return false}
async function activate(e){e.preventDefault();const key=e.target.k.value.trim().toUpperCase();if(!key)return false;$('#kmsg').textContent='Checking…';
 try{const r=await checkKey(key);if(r&&r.valid){LIC={key,holder:r.holder||'',plan:r.plan||'',expires:r.expires_at||'',lastOk:Date.now(),offline:false};saveLic(LIC);$('#keyscreen').style.display='none';await boot()}else $('#kmsg').textContent=LWHY[r&&r.reason]||'This product key could not be verified.'}
 catch(x){const m=String(x&&x.message||'');$('#kmsg').textContent=/^HTTP 404/.test(m)?'The license server answered "404 not found". Check the Project URL in the app settings, and that supabase_licenses.sql was run in Supabase.':/^HTTP (401|403)/.test(m)?'The license server refused the request ('+m+'). Check the publishable key in the app settings.':/^HTTP/.test(m)?'License server error ('+m+'). Please try again shortly.':'Cannot reach the license server. Check your internet connection and the Project URL, then try again.'}return false}
async function recheck(){try{const r=await checkKey(LIC.key);if(r&&r.valid){LIC={...LIC,holder:r.holder||'',plan:r.plan||'',expires:r.expires_at||'',lastOk:Date.now(),offline:false};saveLic(LIC);alert('License verified.');render()}else{alert(LWHY[r&&r.reason]||'License not valid.');}}catch(e){alert('Cannot reach the license server.')}}
async function deactivate(){if(!confirm('Deactivate this device? You can then use the key on another device. Your project data stays on this device.'))return;try{await rpc('release_device',{p_key:LIC.key,p_device:devId()})}catch(e){alert('Could not reach the license server — try again when online.');return}
 try{localStorage.removeItem(LK)}catch(x){}LIC=null;if(S)await save();location.reload()}
const licenseCard=()=>{const L=LIC;return sub('License',L?`<div class="tw"><table>${[['Licensed to',L.holder||'—'],['Plan',L.plan||'—'],['Product key',L.key.slice(0,4)+'-••••-••••-'+L.key.slice(-4)],['Expires',L.expires?new Date(L.expires).toLocaleDateString():'No expiry'],['Last verified',new Date(L.lastOk).toLocaleString()+(L.offline?' (offline — grace period)':'')],['Device ID',devId().slice(0,8)],['Version',CFG.VERSION]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</table></div><button class="s" onclick="recheck()">Re-check now</button>${adm()?'<button class="s" onclick="deactivate()">Deactivate this device</button>':''}`:'<p class="muted">Development build (no license required).</p>')};
/* ---- projects: each has its own IndexedDB database ---- */
function syncName(v){v=String(v||'').trim();if(!v)return;if(CP){CP.name=v;const e=REG.find(x=>x.id==CP.id);if(e)e.name=v;regSave()}$('#pn').textContent=v;$('#lt').textContent=v;const roots=S.wbs.filter(n=>n.level==1);if(roots.length==1)roots[0].name=v}
const setProj=(st,k,v)=>{const r=st.proj.find(x=>x.k.toLowerCase()==k.toLowerCase());if(r)r.v=v;else st.proj.unshift({k,v})};
const blankState=(name,cid,client)=>({users:[{u:'admin',p:hs('admin123'),role:'Admin'},{u:'engineer',p:hs('eng123'),role:'Engineer'},{u:'viewer',p:hs('view123'),role:'Viewer'}],proj:[{k:'Project',v:name||''},{k:'Employer',v:client||''},{k:'Contract ID',v:cid||''},{k:'Consultant',v:''},{k:'Contractor',v:''}],staff:[],eqp:[],subs:[],boq:[],res:[],rates:[],norms:{},wbs:[{id:'W1',parent:'',level:1,name:name||'Project'}],plan:[],costs:[],vars:[],rep:{},bdate:''});
const OLDN='\u0000',NEWN='';
function normalize(){const had=Array.isArray(S.wbs);['users','proj','staff','eqp','subs','boq','res','rates','plan','costs','vars','wbs'].forEach(k=>S[k]=S[k]||[]);if(!had&&CP&&CP.db=='cpm')S.wbs=JSON.parse(JSON.stringify(SEED.wbs||[]));if(!S.users.length)S.users=blankState('').users;S.norms=S.norms||{};S.rep=S.rep||{};S.bdate=S.bdate||'';S.proj.forEach(x=>{if(/^project$/i.test(x.k)&&x.v===OLDN)x.v=NEWN});S.wbs.forEach(n=>{if(n.level==1&&n.name===OLDN)n.name=NEWN});
 {let m=0;Object.keys(S.rep).sort().forEach(k=>{const r=S.rep[k];if(r.no)m=Math.max(m,+r.no);else r.no=++m})}
 S.boq.forEach(b=>{if(b.qty===undefined&&b.q!==undefined){b.qty=b.q;b.rate=b.r;delete b.q;delete b.r}})}
function showLauncher(){$('#app').style.display='none';$('#login').style.display='none';$('#launcher').style.display='flex';
 $('#plist').innerHTML=REG.length?REG.map(p=>`<div class="prow"><b>${esc(p.name)}</b><span class="muted">${new Date(p.last||p.created).toLocaleDateString()}</span><button class="p" onclick="openProject('${p.id}')">Open</button><button class="del" title="Delete project" onclick="delProject('${p.id}')">✕</button></div>`).join(''):'<p class="muted">No projects yet — create one below.</p>'}
async function openProject(id,restore){const p=REG.find(x=>x.id==id);if(!p)return;await dbClose();DBN=p.db;CP=p;S=(await dbGet())||blankState(p.name);normalize();{const pr=S.proj.find(x=>/^project$/i.test(x.k));if(pr&&String(pr.v||'').trim())p.name=String(pr.v).trim()}p.last=Date.now();regSave();
 try{sessionStorage.cpmp=id}catch(e){}$('#launcher').style.display='none';$('#lt').textContent=p.name;$('#pn').textContent=p.name;$('#cd').value=cd;$('#login form').reset();
 let u=null;if(restore){try{u=S.users.find(x=>x.u==sessionStorage.cpmu)}catch(e){}}
 if(u){U=u;$('#login').style.display='none';$('#app').style.display='block';render()}else{U=null;$('#app').style.display='none';$('#login').style.display='flex';$('#lerr').textContent=''}}
async function closeProject(){if(S)await save();U=null;S=null;CP=null;try{delete sessionStorage.cpmp;delete sessionStorage.cpmu}catch(e){}await dbClose();regLoad();showLauncher()}
async function addProject(name,st){const id='p'+uid(),p={id,name,db:'cpm_'+id,created:Date.now()};await dbClose();DBN=p.db;S=st;await save();await dbClose();S=null;REG.push(p);regSave();return id}
async function mkProject(e){e.preventDefault();const f=e.target,name=f.n.value.trim();if(!name)return false;
 const st=f.t.value=='sample'?JSON.parse(JSON.stringify(SEED)):blankState(name,f.c.value.trim(),f.cl.value.trim());
 if(f.t.value=='sample'){setProj(st,'Project',name);st.wbs.filter(n=>n.level==1).forEach(n=>n.name=name);if(f.c.value.trim())setProj(st,'Contract ID',f.c.value.trim());if(f.cl.value.trim())setProj(st,'Employer',f.cl.value.trim())}
 const id=await addProject(name,st);f.reset();await openProject(id);alert('Project "'+name+'" created.\nFirst sign-in: admin / admin123 (also engineer / eng123 and viewer / view123).\nPlease change these passwords in Settings after you sign in.');return false}
function impProject(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const st=JSON.parse(r.result);if(!st.boq||!st.proj)throw 0;const id=await addProject((st.proj[0]&&st.proj[0].v)||f.name.replace(/\.json$/i,''),st);await openProject(id)}catch(x){alert('This is not a valid project backup file')}};r.readAsText(f)}
async function delProject(id){const p=REG.find(x=>x.id==id);if(!p)return;if(prompt('This permanently deletes the project and all its data on this device.\nType the project name to confirm:\n\n'+p.name)!==p.name)return;await dbClose();try{indexedDB.deleteDatabase(p.db)}catch(e){}REG=REG.filter(x=>x.id!=id);regSave();showLauncher()}
async function boot(){regLoad();REG.forEach(p=>{if(p.name===OLDN)p.name=NEWN});regSave();$('#cd').value=cd;$('#cd').onchange=e=>{cd=e.target.value||today();render()};
 if(!REG.length){DBN='cpm';db=null;const old=await dbGet();await dbClose();if(old){REG.push({id:'p1',name:((old.proj&&old.proj[0]&&old.proj[0].v)===OLDN?NEWN:(old.proj&&old.proj[0]&&old.proj[0].v))||'Existing project',db:'cpm',created:Date.now()});regSave()}else{try{indexedDB.deleteDatabase('cpm')}catch(e){}}}
 let pid=null;try{pid=sessionStorage.cpmp}catch(e){}
 if(pid&&REG.find(p=>p.id==pid))await openProject(pid,true);else showLauncher()}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function startup(){if(BETA&&!(await licenseGate()))return;await boot()}
startup();
</script></body></html>
